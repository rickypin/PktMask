[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pktmask"
version = "0.2.0"
description = "A GUI tool for masking IP addresses in pcap/pcapng files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "scapy>=2.5.0,<3.0.0",      # Core packet processing
    "PyQt6>=6.4.0,<7",          # GUI framework (includes PyQt6-Qt6 and PyQt6_sip)
    "markdown>=3.4.0,<4",       # User guide rendering
    "jinja2>=3.1.0,<4",         # HTML report templates (includes MarkupSafe)
    "pydantic>=2.0.0,<3",       # Configuration validation
    "PyYAML>=6.0.0,<7",         # YAML configuration files
    "typer>=0.9.0,<1.0.0",      # CLI framework
    "typing-extensions>=4.0.0;python_version<'3.10'"  # Type hints backport
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "pytest-html",
    "pytest-metadata",
    "pytest-qt",
    "pytest-xdist",
    "coverage",
    "iniconfig",
    "pluggy",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pytest-mock>=3.0.0",
    "pytest-env",
    "isort>=5.0.0",  # 从子包合并
    "pre-commit>=3.5.0"
]
build = [
    "pyinstaller",
    "pyinstaller-hooks-contrib",
    "altgraph",
    "macholib"
]
performance = [  # Performance monitoring (optional)
    "psutil>=5.9.0",            # System resource monitoring
    "memory-profiler>=0.60.0"   # Memory profiling
]

[project.urls]
Homepage = "https://github.com/yourusername/pktmask"
Documentation = "https://github.com/yourusername/pktmask#readme"
Repository = "https://github.com/yourusername/pktmask.git"
Issues = "https://github.com/yourusername/pktmask/issues"

[project.scripts]
pktmask = "pktmask.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pktmask"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/samples",
    "tests/samples/**",
    "tests/data",
    "tests/data/**",
    "tmp/**",
    "backup/**",
    "*.log",
    "*.tmp",
    ".DS_Store",
    "__pycache__/**"
]


[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "W503",  # line break before binary operator (conflicts with black)
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

